name: Compilar Jarvis APK
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Preparar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Preparar Android SDK
        uses: android-actions/setup-android@v3
      - name: Instalar SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restaurar firma debug personal
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: jarvis-debug-signature-v1
      - name: Extraer proyecto autocontenido
        shell: python
        run: |
          import base64,io,zipfile
          payload = ""
          with zipfile.ZipFile(io.BytesIO(base64.b64decode(payload))) as z:
              z.extractall('.')
      - name: Compilar APK de prueba personal
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Guardar APK descargable
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
